   name: Frontend Deployment
   on:
    push:
      branches:
        - main
      paths: "Frontend/**"
    workflow_dispatch:

   jobs:
     build-and-deploy:
      runs-on: ubuntu-latest

      steps:
       #1. Download repo code
       - name: Checkout code
         uses: actions/checkout@v4.4.0
          #2 . Login to docker Hub
       - name: Docker login 
         uses: docker/login-action@v4.6.0
         with:
          username: ${{ secrets.Docker
      
     
 
    
