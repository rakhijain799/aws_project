   name: Frontend Deployment
   on:
    push:
      branches:
        - main
      paths: "frontend/**"
    workflow_dispatch:

   jobs:
     build-and-deploy:
      runs-on: ubuntu-latest

      steps:
       #1. Download repo code
       - name: Checkout code
         uses: actions/checkout@v4.4.0
       # set up node.js environment
       - name: Set up Node.js
         uses: actions/setup-node@v7.1.0  
         with:
           node-version: '22'

         # 4 Cache npm dependencies using a custom 
       - name: Cache npm dependencies
         id: npm-cache
         uses: actions/cache@v5.1.0
         with:
           path: /node_modules
           key: ${{ runnner.os }}-npm-${{ hashFiles('package-lock.json') }}
           restore-keys: |
             ${{ runner.os }}-npm-
         #5 check for cache hit or miss  and install
       - name: install dependencies
         if: steps.npm-cache.outputs.cache-hit != 'true'
         run: |
          echo "cache miss "
          npm ci

       - name: Print Cache Status
         if: steps.npm-cache.outputs.cache-hit == 'true'
         run: |
          echo "cache hit"
      # . Login to docker Hub
       - name: Docker login 
         uses: docker/login-action@v4.6.0
         with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD}}

          #3 . build and push frontend image
       - name: Build and push Docker image 
         uses: docker/build-push-action@v7.4.0
         with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frontend:latest

            #4. connect to ec2 and deploy

       - name: Deploy to EC2
         uses: appleboy/ssh-action@v1.2.2
         with:
           host: ${{ secrets.EC2_HOST }}
           username: ubuntu
           key: ${{ secrets.EC2_SSH_KEY }}
           script: |
             docker pull ${{ secrets.DOCKER_USERNAME }}/frontend:latest
             docker stop frontend || true
             docker rm frontend || true
             docker run -d \
                --name frontend \
                --restart unless-stopped \
                -p 5173:5173 \
                ${{ secrets.DOCKER_USERNAME }}/frontend:latest

     
 
    
